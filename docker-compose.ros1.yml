services:
  lesta-ros1:
    build:
      context: .
      dockerfile: docker/Dockerfile.ros1
    image: lesta:ros1-cu128
    container_name: lesta-ros1
    network_mode: host
    stdin_open: true
    tty: true
    gpus: all
    environment:
      ROS_MASTER_URI: http://127.0.0.1:11311
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - ./:/workspace/LeSTA
      - ./data_preprocessing/datasets/urban_traversability/raw:/workspace/bags:ro
      - ./models:/root/Downloads:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    working_dir: /workspace/ros_ws
    command: /bin/bash
