lesta_trav_mapping:
  ros__parameters:
    node:
      lidarscan_topic: /velodyne/points
      map_publish_rate: 1.0
      scan_filter_range: 6.0
      remove_backpoints: true
      debug_mode: false
    frame_id:
      robot_frame: base_link
      map_frame: map
    height_mapper:
      estimator_type: StatMean
      frame_id: map
      map_length_x: 200.0
      map_length_y: 200.0
      grid_resolution: 0.1
      min_height_threshold: -0.2
      max_height_threshold: 1.5
    traversability_mapper:
      model_path: /workspace/models/LeSTA_campus_road_libtorch.pt
      input_dimension: 4
      feature_fields: [step, slope, roughness, curvature]
      binary_threshold: 0.5
      use_log_odds_update: true
      learning_rate: 0.7
      prob_min: 0.05
      prob_max: 0.95
