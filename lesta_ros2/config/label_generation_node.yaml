lesta_label_generation:
  ros__parameters:
    node:
      lidarscan_topic: /velodyne/points
      map_publish_rate: 1.0
      pose_update_rate: 10.0
      remove_backpoints: true
      debug_mode: false
    frame_id:
      robot_frame: base_link
      map_frame: map
    height_mapper:
      estimator_type: StatMean
      frame_id: map
      map_length_x: 200.0
      map_length_y: 200.0
      grid_resolution: 0.1
      min_height_threshold: -0.2
      max_height_threshold: 1.5
    label_generator:
      footprint_radius: 0.3
      max_traversable_step: 0.2
